name: Local Tests

# Triage (2026-09-05): manual trigger only for now. The job needs a
# self-hosted runner, which esa/asn1scc does not have, so on every push the
# run sat queued forever. Ateleris to gate it on their repository (e.g.
# `if: github.repository == 'ateleris/asn1scc'`) and restore the trigger.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t asn1scc .

    - name: Make build script executable
      run: chmod +x ./run-ci-tests.sh

    - name: Run container to build and test
      run: docker run --rm -v ${{ github.workspace }}:/app asn1scc bash -c "./run-ci-tests.sh"
