name: Generated-code diff gate

# Diffs the code generated by this commit against the code generated by its baseline
# (default: the merge base with master) over the v4Tests corpus: v4Tests/scripts/diffGenerated.py,
# one job per configuration (C / Ada x ws4 / ws8 x legacy / acn-v2, C slim). Generation only.
# A change that must not alter the existing backends expects 0 findings.
#
# Triggers: manually (gh workflow run diff-gate.yml --ref <branch> [-f baseline=<ref>]),
# a pull request labelled "diff-gate", or a push whose head commit message contains "[diff-gate]".

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "baseline ref (default: merge base with master)"
        required: false
        default: ""
  pull_request:
    types: [ labeled, synchronize ]
  push:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/esa/asn1scc-ci

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'diff-gate')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[diff-gate]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      baseline: ${{ steps.base.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Baseline commit
      id: base
      run: |
        if [ -n "${{ inputs.baseline }}" ]; then ref="${{ inputs.baseline }}"; else ref=$(git merge-base origin/master HEAD); fi
        sha=$(git rev-parse "$ref^{commit}")
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "candidate $(git rev-parse HEAD), baseline $sha ($ref)"

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.base.outputs.sha }}
        path: baseline

    - name: Image tag (hash of the Dockerfile)
      id: tag
      run: echo "image=${IMAGE_REPO}:df-$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull the image, or build and push it if the tag is missing
      run: |
        if ! docker pull -q "${{ steps.tag.outputs.image }}"; then
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"
        fi

    - name: Build candidate and baseline
      run: |
        docker run --rm -v "${{ github.workspace }}:/app" "${{ steps.tag.outputs.image }}" bash -c '
          source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          set -e
          for tree in . baseline; do
            (cd $tree && dotnet build Antlr/ -v q && dotnet build parseStg2/ -v q && dotnet build asn1scc/asn1scc.fsproj -v q)
          done
          tar -czf compilers.tgz asn1scc/bin/Debug/net10.0 baseline/asn1scc/bin/Debug/net10.0'

    - uses: actions/upload-artifact@v4
      with:
        name: compilers
        path: compilers.tgz
        retention-days: 3

  diff:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        config: [ c-ws4, c-ws8, c-ws8-slim, Ada-ws4, Ada-ws8, c-ws4-v2, c-ws8-v2, Ada-ws4-v2, Ada-ws8-v2 ]
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/download-artifact@v4
      with:
        name: compilers

    - name: Diff ${{ matrix.config }}
      run: |
        tar -xzf compilers.tgz
        docker pull -q "${{ needs.build.outputs.image }}"
        set +e
        docker run --rm -v "${{ github.workspace }}:/app" "${{ needs.build.outputs.image }}" bash -c '
          cd v4Tests && python3 ./scripts/diffGenerated.py \
            --baseline ../baseline/asn1scc/bin/Debug/net10.0/asn1scc \
            --candidate ../asn1scc/bin/Debug/net10.0/asn1scc \
            --configs ${{ matrix.config }} -j 4 -o ../diff-report/${{ matrix.config }}'
        rc=$?
        echo "exit code $rc (0 = no differences, 1 = differences, 2 = tool error)"
        sudo rm -rf diff-report/${{ matrix.config }}/work
        [ $rc -le 1 ]

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diff-${{ matrix.config }}
        path: diff-report/
        retention-days: 14

  summary:
    needs: [ build, diff ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: diff-*
        path: reports
        merge-multiple: true

    - name: Summary
      run: |
        {
          echo "## Generated-code diff gate"
          echo
          echo "candidate \`${{ github.sha }}\`, baseline \`${{ needs.build.outputs.baseline }}\`"
          echo
          echo "| config | cases compared | cases with differences |"
          echo "|---|---|---|"
          for r in reports/*/report.md; do grep -E '^\| [A-Za-z]' "$r" | grep -v '^| config' ; done
          echo
          for r in reports/*/report.md; do
            n=$(grep -oE '^[0-9]+ finding' "$r" | cut -d' ' -f1)
            if [ "${n:-0}" -gt 0 ]; then echo "### $(basename $(dirname $r))"; sed -n '/finding(s) in/,$p' "$r" | head -80; echo; fi
          done
        } > summary.md
        cat summary.md >> "$GITHUB_STEP_SUMMARY"
        total=$(cat reports/*/report.md | grep -oE '^[0-9]+ finding' | awk '{s+=$1} END {print s+0}')
        missing=$((9 - $(ls reports/*/report.md | wc -l)))
        echo "findings: $total, configs without a report: $missing"
        [ "$total" -eq 0 ] && [ "$missing" -eq 0 ]
