name: Python Unit Tests

# Only exercises the Asn1AcnTestLib ("testlib") corpus
on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set owner of working dir recursively (Hotfix)
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t asn1scc .

      - name: Build and run the testlib tests (ACN and uPER)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          asn1scc \
          bash -c '
            source "$HOME/.sdkman/bin/sdkman-init.sh" &&
            dotnet build Antlr &&
            dotnet build parseStg2 &&
            dotnet build asn1scc &&
            ./v4Tests/scripts/runPythonTestlib.sh -o generated-python-output -j .
          '

      - name: Upload test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results-testlib.xml
            test-results-uper-testlib.xml
