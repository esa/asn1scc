name: Generated-code coverage baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build non-root measurement image
        run: |
          docker build -f v4Tests/coverage/Dockerfile \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            -t asn1scc-coverage:phase0b .
      - name: Check collector failure handling
        run: docker run --rm --network none --entrypoint python3 asn1scc-coverage:phase0b /opt/coverage/testCollector.py
      - name: Measure corpus and mode pilots
        shell: bash
        run: |
          coverage_status=0
          measure() {
            local coverage_name="$1"
            shift
            mkdir -p "coverage-results/$coverage_name"
            docker run --name "$coverage_name" --network none \
              asn1scc-coverage:phase0b --outdir /results "$@" || coverage_status=1
            docker cp "$coverage_name":/results/. \
              "coverage-results/$coverage_name/" || coverage_status=1
          }
          measure baseline-c --compare-baseline
          measure pilot-c-v2 --cohort pilot --acn-v2
          measure pilot-ada --cohort pilot --language Ada
          measure pilot-ada-v2 --cohort pilot --language Ada --acn-v2
          exit "$coverage_status"
      - name: Preserve reports including failed units
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-code-coverage
          path: coverage-results/
          if-no-files-found: warn
          retention-days: 14
