name: Parallel regression

# The full regression of local-build.sh / asn1scc-tests.yml, split into ~25 parallel jobs.
# Jobs, legs and shards: v4Tests/scripts/ciPlan.py (single source).
#   image    toolchain image in GHCR, tag = hash of the Dockerfile (built and pushed only when missing)
#   build    one dotnet build -> artifact; expected test cases of every leg (regression --list)
#   test     matrix of ciPlan.py --matrix; each job pulls the image and runs ciPlan.py --run <job>
#   summary  per-leg table (expected / ran / OK / failed / missing), failures, slowest cases

on:
  push:
    branches: [ 'ci/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/esa/asn1scc-ci

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4

    - name: Image tag (hash of the Dockerfile)
      id: tag
      run: echo "image=${IMAGE_REPO}:df-$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Job matrix
      id: plan
      run: echo "matrix=$(python3 v4Tests/scripts/ciPlan.py --matrix)" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the image if the tag is missing
      run: |
        if docker buildx imagetools inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
          echo "image ${{ steps.tag.outputs.image }} exists"
        else
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"
        fi

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the solution, list the expected test cases
      run: |
        docker run --rm -v "${{ github.workspace }}:/app" "${{ needs.image.outputs.image }}" bash -c '
          source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          set -e
          dotnet build Antlr/
          dotnet build parseStg2/
          dotnet build asn1scc.sln
          for t in gcc gcov gnatmake gprbuild gnatprove cargo; do printf "%-10s " "$t"; ("$t" --version 2>&1 || true) | head -1; done
          python3 v4Tests/scripts/ciPlan.py --expected expected.tsv
          tar -czf build.tgz asn1scc/bin/Debug/net10.0 regression/bin/Debug/net10.0'

    - uses: actions/upload-artifact@v4
      with:
        name: build
        path: |
          build.tgz
          expected.tsv
        retention-days: 7

  test:
    needs: [ image, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.image.outputs.matrix) }}
    name: test (${{ matrix.job }})
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/download-artifact@v4
      with:
        name: build

    - name: Pull the image
      run: docker pull -q "${{ needs.image.outputs.image }}"

    - name: Run ${{ matrix.job }}
      run: |
        tar -xzf build.tgz
        docker run --rm -v "${{ github.workspace }}:/app" "${{ needs.image.outputs.image }}" bash -c '
          source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
          python3 v4Tests/scripts/ciPlan.py --run ${{ matrix.job }}'

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.job }}
        path: ci-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload work directories of failed cases
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failed-workdirs-${{ matrix.job }}
        path: v4Tests/work_dir/
        if-no-files-found: ignore
        retention-days: 7

  summary:
    needs: [ build, test ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: build

    - uses: actions/download-artifact@v4
      with:
        pattern: results-*
        path: results

    - name: Summary
      run: |
        set -o pipefail
        python3 v4Tests/scripts/ciPlan.py --summary results expected.tsv --trx results | tee summary.md >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: summary
        path: summary.md
